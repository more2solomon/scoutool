<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Scout Mail</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

  <div class="brand">
    <div class="logo">S</div>

    <div>
      <h1>Scout Mail</h1>
      <p>Scoutool + Mail Workspace</p>
    </div>
  </div>

  <div class="actions">

    <button id="addAccount">
      + Add Gmail
    </button>

    <button id="reloadScoutool">
      Reload Scoutool
    </button>

    <button id="reloadMail">
      Reload Mail
    </button>

    <button
      id="stop"
      class="danger"
    >
      STOP
    </button>

  </div>

</header>

<div class="accounts-header">

  <strong>Mail accounts</strong>

  <div id="accounts"></div>

</div>

<script src="app.js"></script>

</body>
</html>
