<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scout Mail</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div>
    <h1>Scout Mail</h1>
    <p>Desktop control center</p>
  </div>
</header>

<section class="actions">
  <button id="addAccount">+ Add Account</button>
  <button id="openAll">Open All</button>
  <button id="scoutool">Open Scoutool</button>
  <button id="closeAll" class="danger">Close Mail Windows</button>
</section>

<section class="panel">
  <div class="panelHeader">
    <h2>Mail Accounts</h2>
    <span id="counter">0 / 7</span>
  </div>

  <div id="accounts"></div>
</section>

<script src="app.js"></script>

</body>
</html>
